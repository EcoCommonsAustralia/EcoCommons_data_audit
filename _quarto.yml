project:
  type: website
  output-dir: docs
  resources:
    - data/
  # Re-create the Jekyll opt-out after each render (render cleans docs/).
  post-render:
    - touch docs/.nojekyll

website:
  title: "EcoCommons Data Audit"
  favicon: https://raw.githubusercontent.com/EcoCommons-Australia-2024-2026/ec-notebook_site_materials/main/images/favicon_square.png
  navbar:
    left:
      - href: ecocommons_prod_data_audit.qmd
        text: "Prod Dataset Audit"
      - href: prod_dataset_catalogue.qmd
        text: "Data Catalogue"
      - href: dataset_list.qmd
        text: "Dataset List"
      - href: rule_book.qmd
        text: "Rule Book"

format:
  html:
    css: styles/ec_html_template.css
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    include-before-body:
      text: |
        <div style="margin:0 0 1.5rem;">
          <img src="https://raw.githubusercontent.com/EcoCommons-Australia-2024-2026/ec-notebook_site/main/images/notebooks_banner_withframe.png"
               style="max-width:100%;height:auto;" alt="EcoCommons">
        </div>

editor: visual
